<!DOCTYPE html>
<html>
<head>
  <title>Internal Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat-box { width: 400px; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>Hệ Thống Chat Nội Bộ (Đề 32)</h2>
  <div id="chat-box"></div>
  <input type="text" id="username" placeholder="Tên của bạn" style="width: 100px;">
  <input type="text" id="message" placeholder="Nhập tin nhắn..." style="width: 200px;">
  <button onclick="sendMessage()">Gửi</button>

  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');

    socket.on('chat_history', (messages) => {
      chatBox.innerHTML = '';
      messages.forEach(msg => appendMsg(msg.sender, msg.content));
    });

    socket.on('receive_message', (msg) => {
      appendMsg(msg.sender, msg.content);
    });

    function sendMessage() {
      const sender = document.getElementById('username').value || 'User';
      const content = document.getElementById('message').value;
      if (content) {
        socket.emit('send_message', { sender, content });
        document.getElementById('message').value = '';
      }
    }

    function appendMsg(sender, content) {
      chatBox.innerHTML += `<div><strong>${sender}:</strong> ${content}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
