<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Chat Nội Bộ - Đề 32</title>
  <script src="/socket.io/socket.io.js"></script>
  <!-- Google Font & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #f8fafc; }
    
    /* Layout Container */
    .app-container { display: flex; width: 100%; max-width: 1000px; height: 85vh; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 300px; background: rgba(15, 23, 42, 0.6); border-right: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; padding: 24px 20px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
    .brand i { font-size: 24px; color: #38bdf8; }
    .brand h2 { font-size: 18px; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); background-clip: text; -webkit-text-fill-color: transparent; }
    
    .profile-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); padding: 16px; border-radius: 14px; margin-bottom: 24px; }
    .profile-card label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
    .input-wrapper { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .input-wrapper i { color: #38bdf8; }
    .input-wrapper input { background: transparent; border: none; outline: none; color: #fff; font-size: 13px; width: 100%; font-weight: 500; }
    
    .room-info { margin-top: auto; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 14px; border-radius: 12px; font-size: 12px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    
    /* Main Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.3); }
    
    /* Header */
    .chat-header { height: 70px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .channel-title { display: flex; align-items: center; gap: 10px; }
    .channel-title h3 { font-size: 16px; font-weight: 600; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 4px 10px; border-radius: 20px; }
    .status-dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }
    
    /* Messages Box */
    .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    
    /* Message Items */
    .message-item { display: flex; flex-direction: column; max-width: 70%; animation: fadeIn 0.2s ease-in-out; }
    .message-item.self { align-self: flex-end; align-items: flex-end; }
    .message-item.other { align-self: flex-start; align-items: flex-start; }
    
    .msg-sender { font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    .msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .message-item.self .msg-bubble { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .message-item.other .msg-bubble { background: #334155; color: #f8fafc; border-bottom-left-radius: 4px; }
    
    /* Input Form */
    .chat-input-area { padding: 20px 24px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(15, 23, 42, 0.5); }
    .input-form { display: flex; gap: 12px; }
    .input-form input { flex: 1; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px 18px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.2s; }
    .input-form input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    .input-form button { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); color: #fff; border: none; padding: 0 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .input-form button:hover { opacity: 0.9; transform: translateY(-1px); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-comments"></i>
        <h2>Internal Chat</h2>
      </div>

      <div class="profile-card">
        <label>Tên hiển thị của bạn</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" value="User_1" placeholder="Nhập tên...">
        </div>
      </div>

      <div class="room-info">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Hệ thống Bảo mật & Giám sát (Đề 32)</span>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="channel-title">
          <i class="fa-solid fa-hashtag" style="color: #94a3b8;"></i>
          <h3>phong-chat-chung</h3>
        </div>
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>Trực tuyến</span>
        </div>
      </div>

      <!-- Messages List -->
      <div class="chat-messages" id="chat-box"></div>

      <!-- Input Bar -->
      <div class="chat-input-area">
        <form class="input-form" onsubmit="event.preventDefault(); sendMessage();">
          <input type="text" id="message" placeholder="Nhập tin nhắn..." autocomplete="off">
          <button type="submit">
            <span>Gửi</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');

    socket.on('chat_history', (messages) => {
      chatBox.innerHTML = '';
      messages.forEach(msg => appendMsg(msg.sender, msg.content));
    });

    socket.on('receive_message', (msg) => {
      appendMsg(msg.sender, msg.content);
    });

    function sendMessage() {
      const sender = document.getElementById('username').value.trim() || 'Anonymous';
      const content = document.getElementById('message').value.trim();
      
      if (content !== '') {
        socket.emit('send_message', { sender, content });
        document.getElementById('message').value = '';
      }
    }

    function appendMsg(sender, content) {
      const currentSender = document.getElementById('username').value.trim();
      const isSelf = sender === currentSender;

      const msgDiv = document.createElement('div');
      msgDiv.className = `message-item ${isSelf ? 'self' : 'other'}`;
      
      msgDiv.innerHTML = `
        <span class="msg-sender">${sender}</span>
        <div class="msg-bubble">${escapeHtml(content)}</div>
      `;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
