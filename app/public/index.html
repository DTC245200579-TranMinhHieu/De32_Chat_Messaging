<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Chat Nội Bộ - Đề 32</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #f8fafc; }
    
    .app-container { display: flex; width: 100%; max-width: 1100px; height: 88vh; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; }
    
    /* Sidebar trái */
    .sidebar { width: 300px; background: rgba(15, 23, 42, 0.6); border-right: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; padding: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand i { font-size: 22px; color: #38bdf8; }
    .brand h2 { font-size: 17px; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); background-clip: text; -webkit-text-fill-color: transparent; }
    
    .profile-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 12px; margin-bottom: 16px; }
    .profile-card label { display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .input-wrapper { display: flex; align-items: center; gap: 8px; background: #0f172a; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .input-wrapper input { background: transparent; border: none; outline: none; color: #fff; font-size: 13px; width: 100%; }
    
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; margin: 12px 0 8px 0; }
    .rooms-list { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .room-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: #94a3b8; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .room-item:hover { background: rgba(255, 255, 255, 0.05); color: #f8fafc; }
    .room-item.active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-weight: 600; border: 1px solid rgba(56, 189, 248, 0.3); }
    
    .custom-room-form { display: flex; gap: 6px; margin-top: 10px; }
    .custom-room-form input { flex: 1; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 10px; border-radius: 8px; color: #fff; font-size: 12px; outline: none; }
    .custom-room-form button { background: #38bdf8; color: #0f172a; border: none; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }

    /* Vùng Chat chính */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.3); }
    .chat-header { height: 65px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .channel-title { display: flex; align-items: center; gap: 8px; }
    .channel-title h3 { font-size: 15px; font-weight: 600; }
    
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .message-item { display: flex; flex-direction: column; max-width: 75%; animation: fadeIn 0.2s ease-in-out; }
    .message-item.self { align-self: flex-end; align-items: flex-end; }
    .message-item.other { align-self: flex-start; align-items: flex-start; }
    
    .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .msg-sender { font-size: 12px; font-weight: 600; color: #cbd5e1; }
    .msg-time { font-size: 10px; color: #64748b; }
    
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; word-break: break-word; }
    .message-item.self .msg-bubble { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: #fff; border-bottom-right-radius: 2px; }
    .message-item.other .msg-bubble { background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    
    .system-msg { align-self: center; background: rgba(255, 255, 255, 0.05); color: #94a3b8; font-size: 11px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); }
    
    .typing-indicator { font-size: 11px; color: #38bdf8; font-style: italic; height: 16px; padding: 0 20px; }

    .chat-input-area { padding: 16px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(15, 23, 42, 0.5); }
    .input-form { display: flex; gap: 10px; }
    .input-form input { flex: 1; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 13.5px; outline: none; }
    .input-form button { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); color: #fff; border: none; padding: 0 20px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* Sidebar phải (Online Users) */
    .users-sidebar { width: 220px; background: rgba(15, 23, 42, 0.4); border-left: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; display: flex; flex-direction: column; }
    .user-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; overflow-y: auto; }
    .user-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; }
    .user-status { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Left: Navigation & Rooms -->
    <div class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-comments"></i>
        <h2>Internal Chat</h2>
      </div>

      <div class="profile-card">
        <label>Tên hiển thị</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user" style="color: #38bdf8;"></i>
          <input type="text" id="username" value="User_1" onchange="updateUsername()">
        </div>
      </div>

      <div class="section-title">Danh sách phòng</div>
      <div class="rooms-list" id="rooms-list">
        <div class="room-item active" id="room-phong-chat-chung" onclick="switchRoom('phong-chat-chung')">
          <i class="fa-solid fa-globe"></i>
          <span>Phòng Nội Bộ Chung</span>
        </div>
        <div class="room-item" id="room-phong-dev" onclick="switchRoom('phong-dev')">
          <i class="fa-solid fa-code"></i>
          <span>Phòng Kỹ Thuật Dev</span>
        </div>
      </div>

      <div class="section-title">Tạo / Vào phòng mới</div>
      <div class="custom-room-form">
        <input type="text" id="custom-room-input" placeholder="Tên phòng..." autocomplete="off">
        <button onclick="joinCustomRoom()"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>

    <!-- Center: Main Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="channel-title">
          <i class="fa-solid fa-hashtag" style="color: #38bdf8;"></i>
          <h3 id="current-room-title">phong-chat-chung</h3>
        </div>
      </div>

      <div class="chat-messages" id="chat-box"></div>
      <div class="typing-indicator" id="typing-indicator"></div>

      <div class="chat-input-area">
        <form class="input-form" onsubmit="event.preventDefault(); sendMessage();">
          <input type="text" id="message" placeholder="Nhập tin nhắn..." autocomplete="off" oninput="handleTyping()">
          <button type="submit">
            <span>Gửi</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- Sidebar Right: Online Users -->
    <div class="users-sidebar">
      <div class="section-title">Đang hoạt động (<span id="user-count">0</span>)</div>
      <div class="user-list" id="user-list"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    let currentRoom = 'phong-chat-chung';
    let typingTimeout;

    // Khởi tạo
    joinRoom();

    function updateUsername() {
      joinRoom();
    }

    function joinRoom() {
      const username = document.getElementById('username').value.trim() || 'Anonymous';
      socket.emit('join_room', { username, room: currentRoom });
    }

    function switchRoom(roomName) {
      currentRoom = roomName;
      document.getElementById('current-room-title').innerText = roomName;
      
      document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`room-${roomName}`);
      if (activeEl) activeEl.classList.add('active');

      joinRoom();
    }

    function joinCustomRoom() {
      const roomInput = document.getElementById('custom-room-input').value.trim();
      if (!roomInput) return;
      const formattedRoom = roomInput.toLowerCase().replace(/\s+/g, '-');
      
      if (!document.getElementById(`room-${formattedRoom}`)) {
        const roomsList = document.getElementById('rooms-list');
        const newRoomEl = document.createElement('div');
        newRoomEl.className = 'room-item';
        newRoomEl.id = `room-${formattedRoom}`;
        newRoomEl.onclick = () => switchRoom(formattedRoom);
        newRoomEl.innerHTML = `<i class="fa-solid fa-lock"></i> <span>${formattedRoom}</span>`;
        roomsList.appendChild(newRoomEl);
      }

      switchRoom(formattedRoom);
      document.getElementById('custom-room-input').value = '';
    }

    // Socket Event Listeners
    socket.on('chat_history', (messages) => {
      chatBox.innerHTML = '';
      messages.forEach(msg => appendMsg(msg.sender, msg.content, msg.created_at));
    });

    socket.on('receive_message', (msg) => {
      appendMsg(msg.sender, msg.content, msg.created_at);
    });

    socket.on('system_message', (msg) => {
      const sysDiv = document.createElement('div');
      sysDiv.className = 'system-msg';
      sysDiv.innerText = msg.content;
      chatBox.appendChild(sysDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('room_users', (users) => {
      const userListEl = document.getElementById('user-list');
      document.getElementById('user-count').innerText = users.length;
      userListEl.innerHTML = '';
      users.forEach(u => {
        const uEl = document.createElement('div');
        uEl.className = 'user-item';
        uEl.innerHTML = `<span class="user-status"></span> <span>${u}</span>`;
        userListEl.appendChild(uEl);
      });
    });

    socket.on('user_typing', ({ username, isTyping }) => {
      const typingEl = document.getElementById('typing-indicator');
      typingEl.innerText = isTyping ? `✍️ ${username} đang nhập tin nhắn...` : '';
    });

    function handleTyping() {
      socket.emit('typing', true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('typing', false), 1500);
    }

    function sendMessage() {
      const sender = document.getElementById('username').value.trim() || 'Anonymous';
      const content = document.getElementById('message').value.trim();
      
      if (content !== '') {
        socket.emit('send_message', { sender, content });
        socket.emit('typing', false);
        document.getElementById('message').value = '';
      }
    }

    function formatTime(timeStr) {
      const date = timeStr ? new Date(timeStr) : new Date();
      if (isNaN(date.getTime())) return new Date().toLocaleString('vi-VN');
      return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')} - ${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
    }

    function appendMsg(sender, content, timeStr) {
      const currentSender = document.getElementById('username').value.trim();
      const isSelf = sender === currentSender;

      const msgDiv = document.createElement('div');
      msgDiv.className = `message-item ${isSelf ? 'self' : 'other'}`;
      msgDiv.innerHTML = `
        <div class="msg-header">
          <span class="msg-sender">${sender}</span>
          <span class="msg-time">${formatTime(timeStr)}</span>
        </div>
        <div class="msg-bubble">${escapeHtml(content)}</div>
      `;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
